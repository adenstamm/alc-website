name: Performance and availability

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Test intensity
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - load
      target:
        description: Web delivery layer
        required: true
        default: edge
        type: choice
        options:
          - edge
          - azure-origin

permissions:
  contents: read

concurrency:
  group: production-performance
  cancel-in-progress: false

defaults:
  run:
    working-directory: voting-frontend

jobs:
  read-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_PROFILE: ${{ github.event_name == 'schedule' && 'smoke' || inputs.profile }}
      BASE_URL: ${{ (github.event_name == 'schedule' || inputs.target == 'edge') && 'https://albumasu.com' || 'https://thankful-sand-0f7aa4a10.7.azurestaticapps.net' }}
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Reject unsafe edge load tests
        if: env.TEST_PROFILE == 'load' && inputs.target == 'edge'
        run: |
          echo "The load profile must target azure-origin."
          echo "Cloudflare correctly rate-limits a single runner and would skew the result."
          exit 1

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "1.7.1"

      - name: Run read-path performance test
        run: |
          mkdir -p performance-results
          k6 run performance/site-read-path.js

      - name: Add result to workflow summary
        if: always()
        run: |
          if [ -f performance-results/report.md ]; then
            cat performance-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload performance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ env.TEST_PROFILE }}-${{ github.run_id }}
          path: voting-frontend/performance-results/
          if-no-files-found: warn
          retention-days: 30
